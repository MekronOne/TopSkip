name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release archives
        run: |
          test -f dist/TopSkip-3.0.zip
          test -f dist/TopSkip-3.0.xpi
          python3 -m zipfile -l dist/TopSkip-3.0.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/TopSkip-3.0.zip dist/TopSkip-3.0.xpi --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/TopSkip-3.0.zip \
              dist/TopSkip-3.0.xpi \
              --title "Top Skip 3.0" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
